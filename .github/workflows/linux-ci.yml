name: Linux CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: 1.98.1

jobs:
  checks:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libpipewire-0.3-dev libclang-dev
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check format and documentation
        run: |
          cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
          python3 tools/check_docs.py
      - name: Run Clippy
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --workspace --all-features
      - name: Run standalone server demo
        run: |
          log="$RUNNER_TEMP/rustcraft-headless-demo.log"
          cargo +"$RUST_TOOLCHAIN" run --locked -p rustcraft-host --no-default-features --bin rustcraft-server -- --demo --seed 42 2>&1 | tee "$log"
          grep -Fxq 'event=p2_demo_complete' "$log"
